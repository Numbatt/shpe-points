<!--
  One file. No npm, no build step, no framework, no CDN.

  The legitimate objection to a custom dashboard is "who maintains it when nobody is technical?"
  A file with no dependencies has nothing to rot: it works in 2031 exactly as it does today.
  Deploying it means putting this one file on a static host. That is the whole deployment.

  It talks to Supabase's REST API with plain fetch, and signs in through Supabase's Google OAuth
  endpoint by hand — the token comes back in the URL fragment, which is why there is no auth
  library here either.

  The anon key below is public by design. It is safe only because RLS is correct: anon can read
  exactly one view and nothing else. Everything on this page requires an officer's signed-in JWT.
-->
<style>
  /*
    Visual direction: "Crisp".

    Structure comes from hairline rules and alignment, never from boxes, shadows or fills.
    Sections run full bleed and are separated by a single 1px line. Column labels are small,
    uppercase and letter-spaced, which lets them carry the grid without a border doing it.
    Numbers use tabular figures so columns of points line up when you scan 300 of them.

    Colour is almost entirely absent on purpose. The navy is Rice's official blue and appears
    in exactly three places: the active tab underline, the primary button, and a count that is
    waiting on you. Everything else is neutral. If the chapter ever prefers SHPE's palette to
    the university's, change --accent in the block below and nothing else.
  */
  :root {
    /*
      Light only, deliberately. color-scheme does the real work: without it a Mac in dark mode
      still paints the native <select> and <input type="date"> widgets dark on a white page,
      which Volunteering and Adjustments would both show. The logo is built for white too.
    */
    color-scheme: light;
    --bg: #fff; --sunken: #fafafa; --ink: #101418; --muted: #6b7280; --faint: #9ca3af;
    --line: #e5e7eb; --line-strong: #d1d5db;
    --accent: #00205b; --accent-ink: #fff;
    --ok: #04785a; --danger: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- header ---------------------------------------------------------- */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 0 24px; height: 56px; border-bottom: 1px solid var(--line);
  }
  header .mark { display: flex; align-items: center; gap: 10px; }
  /* The lockup is 1920x388, so a fixed height and auto width keeps it undistorted. */
  header .logo { height: 26px; width: auto; flex: none; display: block; }
  header .spacer { flex: 1; }
  header .who { color: var(--muted); font-size: 13px; }

  /* ---- tabs ------------------------------------------------------------ */
  nav { display: flex; gap: 22px; flex-wrap: wrap; padding: 0 24px; border-bottom: 1px solid var(--line); }
  nav button {
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    padding: 13px 0; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer;
  }
  nav button:hover { color: var(--ink); }
  nav button[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  main { padding: 0 24px 80px; max-width: 1440px; }

  /* ---- sections: full bleed, divided by one hairline -------------------- */
  /* The divider sits on the top of each section rather than the bottom, so a section that is
     hidden (Volunteering's hours entry, before an event is picked) leaves no rule behind it. */
  .card { padding: 26px 0; border-top: 1px solid var(--line); }
  .card:first-child { border-top: 0; }
  .card h2 {
    margin: 0 0 16px; font-size: 15px; font-weight: 600; letter-spacing: -.01em;
    display: flex; align-items: baseline; gap: 10px;
  }
  .card h2 .count { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--muted); }
  /* Which record a section is currently acting on, sitting beside its heading. */
  .card h2 .ctx { font-size: 13px; font-weight: 500; color: var(--muted); }
  .card h2 .count.due { color: var(--accent); font-weight: 600; }
  p.hint { margin: 0 0 14px; color: var(--muted); font-size: 13px; }

  /* Collapsible sections use native <details>/<summary> rather than custom JS, so keyboard and
     screen-reader support come for free. The disclosure marker is muted, never navy: navy is
     spent on the active tab, the primary button and a waiting count, and a collapse control is
     none of those. */
  .card > summary { cursor: pointer; list-style: none; }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary::marker { content: ''; }
  .card h2 .chev { display: inline-block; width: 10px; color: var(--faint); font-size: 12px; transition: transform .15s ease; }
  .card[open] > summary .chev { transform: rotate(90deg); }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row .spacer { flex: 1; }

  /* ---- controls -------------------------------------------------------- */
  button.act {
    background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
    border-radius: 3px; padding: 6px 13px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  button.ghost {
    background: none; border: 1px solid var(--line-strong); color: var(--ink);
    border-radius: 3px; padding: 5px 11px; font: inherit; font-size: 14px; cursor: pointer;
  }
  button.ghost:hover { border-color: var(--ink); }
  /* Membership pays zero points and routes to member demographics instead of attendance — an
     officer reaching for GBM should never land on it by accident. Dashed and muted sets it apart
     from the point-paying types beside it; data-membership (rather than reordering the DOM) is
     what typeButtons() also uses to sort it last. */
  button.ghost[data-membership] { border-style: dashed; color: var(--faint); margin-left: 4px; }
  button.ghost[data-membership]:hover { border-color: var(--faint); color: var(--muted); }
  /* "Not an event" dismisses a discovered form rather than typing it, so it must never read as
     one more type button beside it: --danger and a border sets it apart the same way
     data-membership sets GBM apart from point-paying types. */
  button.ghost[data-dismiss] { color: var(--danger); border-color: var(--line-strong); }
  button.ghost[data-dismiss]:hover { border-color: var(--danger); }
  button.act:hover { filter: brightness(1.15); }
  button.ghost:disabled, button.act:disabled { opacity: .4; cursor: not-allowed; }
  input, select, textarea {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line-strong); border-radius: 3px; padding: 6px 9px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  select:disabled { color: var(--faint); background: var(--sunken); opacity: 1; }
  textarea { width: 100%; min-height: 160px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }

  /* ---- tables ---------------------------------------------------------- */
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th {
    color: var(--faint); font-weight: 500; font-size: 11px;
    text-transform: uppercase; letter-spacing: .09em;
    border-bottom-color: var(--line-strong); padding-bottom: 7px;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--sunken); }
  /* Selectable rows. The selected row is weighted rather than coloured: navy is spent on the
     active tab, the primary button and a waiting count, and nothing else. */
  tbody tr.pick { cursor: pointer; }
  tbody tr.picked td { background: var(--sunken); font-weight: 600; }
  td code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; color: var(--muted); }
  td.num { font-weight: 500; }

  /* ---- small pieces ---------------------------------------------------- */
  .pill {
    display: inline-block; padding: 2px 7px; border: 1px solid var(--line-strong);
    border-radius: 3px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
  }
  /* The one event a year that collects membership. Dashed, like the Membership type button it
     comes from, so the two read as the same idea in both places it appears. */
  .pill.mf { border-style: dashed; }
  /* A dismissed event, still listed so it can be restored. Muted rather than hidden: the whole
     reason this screen exists is that events which left the queue became invisible. Links inside
     stay legible, or the row would be unreadable rather than merely quiet. */
  tr.dim td { color: var(--faint); }
  tr.dim a { color: inherit; }

  /* An action cell that must never wrap its buttons onto a second line, however cramped the
     column beside it gets (e.g. the netID-lookup column, which holds a netid input and a
     disclosure). Reserving min-width means the squeeze lands on that neighbour, not here. */
  td.actions { white-space: nowrap; min-width: 168px; }
  td.actions.row { flex-wrap: nowrap; }

  /* The "search a different spelling" box: a manual override for when the automatic directory
     search (run on the detected name, no click needed) misses because the form's spelling is
     off. Prefilled with that same name so retrying is one keystroke away, but the name is
     already shown one column over, so the box stays behind a disclosure rather than showing it
     a second time. */
  input.search-alt { font-size: 12px; color: var(--muted); padding: 4px 7px; width: 120px; }
  details.alt-search { margin-top: 4px; }
  details.alt-search > summary {
    cursor: pointer; list-style: none; color: var(--muted); font-size: 12px;
  }
  details.alt-search > summary::-webkit-details-marker { display: none; }
  details.alt-search > summary::marker { content: ''; }
  details.alt-search[open] > summary { margin-bottom: 4px; }

  /* Directory-lookup candidates, shared by the unmatched-signins search and the per-row "No name
     on file" lookup. A compact bordered chip per candidate, stacked, rather than a loose block —
     so a result never shifts the height of the rows above or below it awkwardly. */
  .cand-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .cand-chip {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    border: 1px solid var(--line-strong); border-radius: 4px; padding: 5px 9px; font-size: 13px;
  }
  .cand-chip button.ghost { padding: 2px 8px; font-size: 13px; }
  .cand-chip .meta { color: var(--muted); font-size: 12px; }

  /* ---- year switcher ---------------------------------------------------- */
  /* The current year is the one piece of global state every screen keys off, so it doubles as
     the control that changes it. Switching and creating live where the year is already shown
     rather than behind a tab. */
  .yearsel { position: relative; display: inline-flex; }
  button.pill { font: inherit; font-size: 11px; cursor: pointer; background: none; line-height: 1.5; }
  button.pill:hover { border-color: var(--ink); color: var(--ink); }
  button.pill::after { content: ""; display: inline-block; margin-left: 6px; border: 3px solid transparent; border-top-color: currentColor; transform: translateY(2px); }

  .menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 210px;
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: 4px;
    box-shadow: 0 6px 20px rgb(0 0 0 / .09); padding: 4px 0;
  }
  .menu button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; padding: 7px 12px; font: inherit; font-size: 14px;
    color: var(--ink); cursor: pointer;
  }
  .menu button:hover { background: var(--sunken); }
  .menu .sep { border-top: 1px solid var(--line); margin: 4px 0; }

  /* A row is two controls: pick the year, or open its settings. They cannot be nested buttons,
     so the row is a flex container and the hover highlight moves to it. */
  .menurow { display: flex; align-items: center; }
  .menurow:hover { background: var(--sunken); }
  .menurow button:hover { background: none; }
  .menurow .pick { flex: 1; }
  /* The current year is muted rather than labelled: it is the one row that does nothing when
     clicked, and greying it says that without spending a word on it. */
  .menurow .pick.is-current { color: var(--muted); }
  .menu .gear {
    width: auto; flex: none; padding: 7px 12px 7px 6px; color: var(--faint);
    opacity: 0; transition: opacity .12s;
  }
  .menurow:hover .gear, .menu .gear:focus-visible { opacity: 1; }
  .menu .gear:hover { color: var(--ink); }

  dialog {
    border: 1px solid var(--line-strong); border-radius: 5px; padding: 0;
    background: var(--bg); color: var(--ink); max-width: 92vw; width: 420px;
  }
  dialog::backdrop { background: rgb(0 0 0 / .28); }
  dialog h2 { margin: 0; font-size: 15px; font-weight: 600; padding: 18px 20px 0; }
  dialog .body { padding: 16px 20px 20px; display: grid; gap: 12px; }
  dialog label { display: grid; gap: 5px; font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .09em; }
  dialog .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 0 20px 20px; }
  .empty { color: var(--faint); font-size: 14px; }
  .none { color: var(--faint); }
  .err { color: var(--danger); }
  .ok { color: var(--ok); }
  a { color: var(--accent); }

  #toast {
    position: fixed; inset-inline: 0; bottom: 24px; margin: auto; width: max-content; max-width: 90vw;
    background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 4px;
    opacity: 0; transition: opacity .18s; pointer-events: none; font-size: 14px;
  }
  #toast.show { opacity: 1; }

  /* Present to screen readers and to the document outline, absent from the page. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .signin { max-width: 380px; margin: 18vh auto; text-align: center; padding: 0 24px; }
  .signin .logo { width: 180px; height: auto; margin: 0 auto 26px; display: block; }
  .signin p { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
</style>
</head>

  <div class="foot">
    <button class="ghost" id="y-cancel">Cancel</button>

</dialog>

// ---------------------------------------------------------------------------
// Auth — Supabase's Google OAuth by hand. The token arrives in the URL fragment.
// ---------------------------------------------------------------------------
const TOKEN_KEY = 'shpe_points_token';
let session = null;

function readSession() {
  if (location.hash.includes('access_token')) {
    const p = new URLSearchParams(location.hash.slice(1));
    const token = p.get('access_token');
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
      history.replaceState(null, '', location.pathname + location.search);
    }
  }
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) return null;
  try {
    const claims = JSON.parse(atob(token.split('.')[1]));
    if (claims.exp * 1000 < Date.now()) { localStorage.removeItem(TOKEN_KEY); return null; }
    return { token, email: claims.email };
  } catch { localStorage.removeItem(TOKEN_KEY); return null; }
}

const signIn = () => {
  location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(location.origin + location.pathname)}`;
};
const signOut = () => { localStorage.removeItem(TOKEN_KEY); location.reload(); };

// Google is the ONLY way in. There is deliberately no password form and no shared passcode.
//
// A shared passcode would break the audit trail the rest of the system depends on: `adjustments`
// records who awarded manual points, and these points decide an $800 sponsorship. "Whoever had the
// code" is not an author. It also cannot be revoked in practice — a code known to every officer
// since 2026 still works for the ones who graduated in 2027.
//
// Per-person Google accounts mean MFA is inherited from Rice, there is no password for the club to
// store or hand over, no reset flow to maintain (this project has no mail server), and removing one
// officer never disturbs anyone else.

// ---------------------------------------------------------------------------
// REST helpers
// ---------------------------------------------------------------------------
async function api(path, init = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...init,
    headers: {
      apikey: ANON_KEY,
      Authorization: `Bearer ${session.token}`,
      'content-type': 'application/json',
      ...(init.headers || {}),
    },
  });
  if (!res.ok) throw new Error(await res.text());
  // PostgREST answers a write with an empty body unless asked for one, so parsing
  // unconditionally would turn a successful insert into a JSON error.
  const body = await res.text();
  return body ? JSON.parse(body) : null;
}
const get = (p) => api(p);
const post = (p, body, prefer) => api(p, { method: 'POST', headers: prefer ? { Prefer: prefer } : {}, body: JSON.stringify(body) });
const patch = (p, body) => api(p, { method: 'PATCH', body: JSON.stringify(body) });
const del = (p) => api(p, { method: 'DELETE' });
const rpc = (fn, args) => post(`rpc/${fn}`, args);

/**
 * Call an Edge Function. Separate from api() because these live under /functions/v1/ rather than
 * /rest/v1/ and answer with plain JSON rather than PostgREST's conventions.
 *
 * Used only for things the browser genuinely cannot do itself: search.rice.edu sends no CORS
 * headers, so every directory lookup has to be relayed server-side. The officer's own token goes
 * along and the function checks is_officer() with it.
 */
async function edgeFn(name, body) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
    method: 'POST',
    headers: { apikey: ANON_KEY, Authorization: `Bearer ${session.token}`, 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ---------------------------------------------------------------------------
// Tiny DOM helpers — enough structure to stay readable without a framework.
// ---------------------------------------------------------------------------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const el = (id) => document.getElementById(id);

/** Right-aligned count beside a section heading. Turns navy when it is waiting on someone. */
const countTag = (n, due = n > 0) => `<span class="count${due ? ' due' : ''}">${n}</span>`;

/** Empty cell. A dash reads as data; muted text reads as absence. */
const blank = (label = 'not set') => `<span class="none">${label}</span>`;

// An event's name, linked to its Google Form when we know which form produced it. Same URL shape
// and same /edit target as the unreadable-forms card, so the two behave identically. Manual events
// (volunteering, anything typed in by hand) have no form and stay plain text.
const eventLink = (name, formId) => formId
  ? `<a href="https://docs.google.com/forms/d/${esc(formId)}/edit" target="_blank" rel="noopener">${esc(name)}</a>`
  : esc(name);

/** Does this type code mean "membership form"? Read off state.eventTypes, loaded once in boot(). */
const isMembershipType = (code) => state.eventTypes.some((t) => t.code === code && t.is_membership_form);

/**
 * The one type change that DESTROYS data, so it is the one that asks first.
 *
 * events_membership_retype_replays deletes the event's attendance and resets the form's high-water
 * mark so the poller re-reads it from the beginning. That is recoverable for responses the poller
 * can replay, and NOT recoverable for attendance entered by hand or carried over by a migration,
 * which no form will ever re-send.
 *
 * It also now claims the academic year's membership slot (events_membership_guard), which is worth
 * saying out loud: an officer reaching for it on the wrong event blocks the right one until they
 * clear it on the Events screen. Every other type button is harmless and reversible.
 */
const confirmMembershipType = () => confirm(
  'Typing this as a membership form does two things:\n\n'
  + "\u2022 it becomes the membership form for its academic year \u2014 only one event a year can be, "
  + 'so the right one will be blocked until this is cleared\n'
  + '\u2022 it stops paying attendance points, and everything already recorded against it is '
  + 'cleared and re-read from the form\n\n'
  + 'Attendance added by hand will be lost. Continue?');

let toastTimer;
function toast(msg, isError) {
  const t = el('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--danger)' : '';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

async function guard(fn) {
  try { await fn(); }
  catch (e) { console.error(e); toast(e.message.slice(0, 200), true); }
}

/**
 * Retry an async call a few times with an increasing delay, rather than let one hiccup against a
 * university service stop the whole run. Used by the "look up names" bulk loop, where a single
 * failed batch used to silently end the pass and leave the rest of the queue unresolved.
 */
async function withRetry(fn, attempts = 3, delayMs = 400) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try { return await fn(); }
    catch (e) {
      lastErr = e;
      if (i < attempts - 1) await new Promise((r) => setTimeout(r, delayMs * (i + 1)));
    }
  }
  throw lastErr;
}

/**
 * Render directory-lookup candidates as compact chips into `out`, one per line, and wire each
 * chip's button to `onPick(candidate)`. Shared by the unmatched-signins netID search and the
 * per-row "No name on file" lookup so both read the same way. Never picks automatically — see
 * searchDirectoryByName's header in supabase/functions/_shared/directory.ts for why a human makes
 * every call.
 */
function renderCandidates(out, found, onPick) {
  if (found.tooBroad) {
    out.innerHTML = '<span class="hint">That matches too many people. Try a full name.</span>';
    return;
  }
  if (!found.results?.length) {
    out.innerHTML = '<span class="hint">No match. They may have hidden their directory listing — enter it by hand.</span>';
    return;
  }
  out.innerHTML = `<div class="cand-list">${found.results.map((r, i) => `
    <div class="cand-chip">
      <button class="ghost" data-cand="${i}">${esc(r.name)}</button>
      <code>${esc(r.netid)}</code>
      <span class="meta">${esc([r.year, r.college, r.major].filter(Boolean).join(' · '))}</span>
    </div>`).join('')}</div>`;
  out.querySelectorAll('[data-cand]').forEach((btn) =>
    btn.onclick = () => onPick(found.results[Number(btn.dataset.cand)]));
}

// ---------------------------------------------------------------------------
// Shared state
// ---------------------------------------------------------------------------
// Directory results for unmatched sign-ins, keyed by String(unmatched_signins.id). The search
// runs automatically per row rather than on a click, but attaching or dismissing any row
// re-renders the whole screen (see show()), so without this cache every remaining row would
// re-query the directory on every mutation. A resolved row's entry just goes stale in memory
// until reload — harmless at this scale.
const directoryAutoSearchCache = new Map();
// netIDs the directory has confirmed (this session) it has nothing for — from either the per-row
// "Look up" or a bulk fill-names pass. Greys out a netid's "Look up" button so an officer isn't
// tempted to re-click something that already came back empty. Session-scoped, not persisted:
// directory listings can change (a student un-hiding theirs under FERPA), and a transient network
// miss during fill-names lands in here too (see that mode's header) — a fresh page load, or just
// running the bulk pass again, is the correct way to re-check, not a permanent flag in the DB.
const noDirectoryMatch = new Set();
// volunteerEventId lives here rather than in renderVolunteering so it survives the re-render
// that follows Commit: the officer stays on the event they were entering and can add more.
// open holds collapsible section state (see sectionOpen below), keyed by section id, for the
// same reason: a mutation re-renders the screen and the officer should not lose what they had
// open or closed.
// eventsShowOthers lives here for the same reason volunteerEventId does: it should survive the
// re-render a mutation on the Events screen triggers, not reset every time.
const state = {
  eventTypes: [], currentYear: null, tab: 'attention', volunteerEventId: null, open: {},
  eventsShowOthers: false,
};

const TABS = [
  ['attention', 'Needs attention'],
  ['events', 'Events'],
  ['volunteering', 'Volunteering'],
  ['standings', 'Standings'],
  ['roles', 'Roles'],
  ['adjustments', 'Adjustments'],
  ['officers', 'Officers'],
  ['audit', 'Audit Log'],
];

// ---------------------------------------------------------------------------
// Collapsible sections — used by Needs attention (every section) and Events (one per academic
// year). Built on <details>/<summary> rather than a custom show/hide so the browser handles
// keyboard operation and accessibility for free.
// ---------------------------------------------------------------------------

/**
 * Open/closed state for a collapsible section, persisted in state.open so it survives the
 * show() re-render that follows a mutation. Defaults to open when the section's count is
 * greater than zero, or when forceOpen says the section is worth showing regardless of count
 * (e.g. the current academic year on Events, even with zero events).
 */
function sectionOpen(id, count, forceOpen = false) {
  if (!(id in state.open)) state.open[id] = count > 0 || forceOpen;
  return state.open[id];
}

/** A .card rendered as a <details> element, its open state driven by sectionOpen. */
function detailsCard(id, count, headingHtml, bodyHtml, forceOpen = false) {
  const open = sectionOpen(id, count, forceOpen);
  return `
    <details class="card" data-sec="${esc(id)}"${open ? ' open' : ''}>
      <summary><h2><span class="chev" aria-hidden="true">&#8250;</span>${headingHtml}</h2></summary>
      ${bodyHtml}
    </details>`;
}

/** Keep state.open in sync when an officer opens or closes a section by hand. */
function wireCollapsibles(root) {
  root.querySelectorAll('details[data-sec]').forEach((d) => {
    d.addEventListener('toggle', () => { state.open[d.dataset.sec] = d.open; });
  });
}

// ---------------------------------------------------------------------------
// Screen: Needs attention — the only screen anyone routinely opens.
// ---------------------------------------------------------------------------
async function renderAttention(root) {
  const [untyped, unmatched, unreadable, totals, years, membershipEvents] = await Promise.all([
    // forms(form_id) is a reverse embed across forms.event_id. It comes back as an ARRAY, not an
    // object, because there is no unique constraint on that column — hence forms?.[0] below.
    // It is what lets the event name be a link straight to the Google Form, so an officer deciding
    // what type something was can look at the form instead of hunting for it in Drive.
    get('events?type_code=is.null&ignored_at=is.null&select=id,name,occurred_on,source,forms(form_id)&order=occurred_on.desc'),
    // raw_payload carries what the person actually typed — their name, college, year and major.
    // That is the material an officer needs to work out who a stray personal email belongs to.
    get('unmatched_signins?resolved_at=is.null&select=id,raw_identifier,raw_payload,event_id,events(name,occurred_on,forms(form_id))&order=id.desc'),
    get('forms?unreadable_since=not.is.null&select=form_id,title,last_error,unreadable_since'),
    // name_lookup_dismissed_at=is.null: a person an officer has already given up on chasing a
    // name for (see the "No name on file" Dismiss button) never had first_name/last_name filled
    // in, so filtering purely on those two would leave them stuck in this queue forever.
    get('v_member_totals?select=netid,first_name,last_name,total_points&name_lookup_dismissed_at=is.null&order=total_points.desc'),
    get('academic_years?select=id,starts_on,ends_on&order=starts_on.desc'),
    // Every event that is a membership form, all years. Tiny by construction -- at most one row
    // per academic year, enforced by events_membership_guard.
    get('events?collects_membership=is.true&select=id,name,occurred_on'),
  ]);

  // --- Does this year have a membership form yet? ---
  // A year has ONE. Usually it is the first GBM's sign-in, because one form is what students
  // actually fill out. Nothing on screen used to say when a year had none, which is how 2025-26
  // went by with 331 people holding points and zero membership rows behind them.
  //
  // Shown as a queue item rather than a per-event toggle: asking twenty-odd sign-in forms a year
  // whether each is the membership form is asking a question that has one answer. It disappears
  // the moment one is picked, and moves to the Events screen, where it can be cleared.
  const year = years.find((y) => y.id === state.currentYear);
  const yearHasMembership = !!year && membershipEvents.some(
    (e) => e.occurred_on >= year.starts_on && e.occurred_on <= year.ends_on);

  // Only form-backed events can be it: a manual event has no responses to harvest demographics
  // from. Fetched only when there is actually a decision to make.
  const mfCandidates = year && !yearHasMembership
    ? (await get(`events?occurred_on=gte.${year.starts_on}&occurred_on=lte.${year.ends_on}`
        + '&ignored_at=is.null&select=id,name,occurred_on,forms(form_id)&order=occurred_on'))
        .filter((e) => e.forms?.length)
    : [];

  // An actionable queue: an officer types in a name (or looks one up in the Rice directory) and
  // saves. Standings shows the same people browse-only, with everyone else, once they have one.
  const nameless = totals.filter((t) => !t.first_name && !t.last_name);

  const counts = await Promise.all(untyped.map((e) =>
    get(`attendance?event_id=eq.${e.id}&select=id`).then((r) => r.length)));

  /**
   * Pull a display name out of a sign-in's raw payload.
   *
   * Deliberately dumb: exact matches against a short list of question titles, no fuzziness. This
   * feeds a human deciding whether two records are the same person, so a wrong guess here is worse
   * than showing nothing — it would put a name beside an email that does not belong to it.
   */
  const payloadName = (payload) => {
    const answers = Array.isArray(payload?.answers) ? payload.answers : [];
    const pick = (...titles) => {
      for (const a of answers) {
        const q = String(a?.question ?? '').trim().toLowerCase();
        if (titles.includes(q) && String(a?.answer ?? '').trim()) return String(a.answer).trim();
      }
      return '';
    };
    const full = pick('name', 'full name', 'preferred name');
    if (full) return full;
    return [pick('first name'), pick('last name')].filter(Boolean).join(' ');
  };

  /** Self-reported context from the payload. This, not the name, is what confirms a match. */
  const payloadContext = (payload) => {
    const answers = Array.isArray(payload?.answers) ? payload.answers : [];
    const pick = (...titles) => {
      for (const a of answers) {
        const q = String(a?.question ?? '').trim().toLowerCase();
        if (titles.includes(q) && String(a?.answer ?? '').trim()) return String(a.answer).trim();
      }
      return '';
    };
    return [pick('year', 'class level', 'class'), pick('college'), pick('major')].filter(Boolean).join(' · ');
  };

  const typeButtons = (id) => state.eventTypes
    .map((t) => `<button class="ghost" data-type="${esc(t.code)}" data-event="${esc(id)}"${t.is_membership_form ? ' data-membership' : ''}>${esc(t.label)}</button>`)
    .join(' ');

  root.innerHTML = `
    ${mfCandidates.length === 0 ? '' : detailsCard('att-membership', 1,
      `Membership form for ${esc(year.id)} ${countTag(1)}`, `
      <div class="hint" style="margin-bottom:12px">
        Nothing is collecting membership information for ${esc(year.id)} yet, so Standings&#39; Membership
        facet will stay empty and nobody counts as a member. Usually this is the first GBM&#39;s sign-in &mdash; one form
        is what students actually fill out. Picking it re-reads that form from the beginning and
        fills in majors, class levels and colleges. Everyone keeps the points they already have.
      </div>
      <div class="row">
        <select id="mf-pick">
          <option value="">Choose a form&hellip;</option>
          ${mfCandidates.map((e) => `<option value="${esc(e.id)}">${esc(e.occurred_on)} &middot; ${esc(e.name)}</option>`).join('')}
        </select>
        <button class="act" id="mf-set">Set</button>
      </div>`)}

    ${detailsCard('att-untyped', untyped.length, `Events awaiting a type ${countTag(untyped.length)}`,
      untyped.length === 0 ? '<div class="empty">Nothing waiting.</div>' : `
      <div class="scroll"><table>
        <thead><tr><th>Date</th><th>Event</th><th>Recorded</th><th>Set type</th><th></th></tr></thead>
        <tbody>${untyped.map((e, i) => `
          <tr>
            <td>${esc(e.occurred_on)}</td>
            <td>${eventLink(e.name, e.forms?.[0]?.form_id)} ${e.source === 'manual' ? '<span class="pill">manual</span>' : ''}</td>
            <td class="num">${counts[i]}</td>
            <td class="row">${typeButtons(e.id)}</td>
            <td><button class="ghost" data-dismiss="${esc(e.id)}">Not an event</button></td>
          </tr>`).join('')}
        </tbody>
      </table></div>`)}

    ${detailsCard('att-unmatched', unmatched.length, `Unmatched sign-ins ${countTag(unmatched.length)}`,
      unmatched.length === 0 ? '<div class="empty">Nothing waiting.</div>' : `
      <div class="scroll"><table>
        <thead><tr><th>Event</th><th>Who signed in</th><th>Correct netID</th><th></th></tr></thead>
        <tbody>${unmatched.map((u) => {
          const who = payloadName(u.raw_payload);
          const context = payloadContext(u.raw_payload);
          return `
          <tr>
            <td>${eventLink(u.events?.name ?? '', u.events?.forms?.[0]?.form_id)}</td>
            <td>
              <div><code>${esc(u.raw_identifier ?? '(blank)')}</code></div>
              ${who ? `<div><strong>${esc(who)}</strong></div>` : ''}
              ${context ? `<div class="hint">${esc(context)}</div>` : ''}
            </td>
            <td>
              <input id="fix-${u.id}" size="12" placeholder="netid">
              <div id="cand-${u.id}"></div>
              <details class="alt-search">
                <summary>search a different spelling</summary>
                <input class="search-alt" id="q-${u.id}" placeholder="name to search" value="${esc(who)}">
              </details>
            </td>
            <td class="row actions">
              <button class="act" data-resolve="${u.id}">Attach</button>
              <button class="ghost" data-drop="${u.id}">Dismiss</button>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>`)}

    ${detailsCard('att-unreadable', unreadable.length, `Forms the poller cannot read ${countTag(unreadable.length)}`,
      unreadable.length === 0 ? '<div class="empty">None.</div>' : `
      <div class="scroll"><table>
        <thead><tr><th>Form</th><th>Since</th><th>Error</th></tr></thead>
        <tbody>${unreadable.map((f) => `
          <tr>
            <td><a href="https://docs.google.com/forms/d/${esc(f.form_id)}/edit" target="_blank" rel="noopener">${esc(f.title || f.form_id.slice(0, 14))}</a></td>
            <td>${esc((f.unreadable_since || '').slice(0, 10))}</td>
            <td style="white-space:normal">${esc(f.last_error || '')}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>`)}

    ${detailsCard('att-nameless', nameless.length, `No name on file ${countTag(nameless.length)}`,
      nameless.length === 0 ? '<div class="empty">None.</div>' : `
      <div class="row" style="margin-bottom:12px">
        <button class="act" id="lookup-names">Look up names in the Rice directory</button>
        <span class="hint">Fills blanks only, never changes a name someone typed. Students who
        hid their directory listing stay blank and need typing in by hand.</span>
      </div>
      <div class="scroll"><table>
        <thead><tr><th>netID</th><th>Points</th><th>First</th><th>Last</th><th></th></tr></thead>
        <tbody>${nameless.map((t) => {
          const noMatch = noDirectoryMatch.has(t.netid);
          return `
          <tr>
            <td><code>${esc(t.netid)}</code></td>
            <td class="num">${t.total_points}</td>
            <td><input id="fn-${esc(t.netid)}" size="10"></td>
            <td><input id="ln-${esc(t.netid)}" size="10"></td>
            <td>
              <div class="row actions">
                <button class="act" data-name="${esc(t.netid)}">Save</button>
                <button class="ghost" data-namesearch="${esc(t.netid)}"${noMatch ? ' disabled title="Already checked — the Rice directory has nothing for this netID."' : ''}>Look up</button>
                <button class="ghost" data-namedismiss="${esc(t.netid)}">Dismiss</button>
              </div>
              <div id="ncand-${esc(t.netid)}">${noMatch ? '<span class="hint">No match. They may have hidden their directory listing — enter it by hand.</span>' : ''}</div>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>`)}`;

  wireCollapsibles(root);

  root.querySelectorAll('[data-type]').forEach((b) => b.onclick = () => guard(async () => {
    if (b.hasAttribute('data-membership') && !confirmMembershipType()) return;
    await patch(`events?id=eq.${b.dataset.event}`, { type_code: b.dataset.type, points: null });
    toast('Type set. Points awarded to everyone recorded.');
    show('attention');
  }));

  // Dismissing a discovered form that was never an event sign-in (an officer application, a
  // t-shirt survey). The event row is kept as a tombstone rather than deleted: forms.event_id
  // is ON DELETE CASCADE, so deleting the event would delete the forms row too, and the poller
  // would rediscover the form as brand new next run — an infinite loop. Its attendance and
  // unmatched sign-ins are cleared since a non-event's are worth 0 points either way.
  root.querySelectorAll('[data-dismiss]').forEach((b) => b.onclick = () => guard(async () => {
    if (!confirm('Mark this as not an event? Its recorded attendance and unmatched sign-ins will be cleared.')) return;
    const id = b.dataset.dismiss;
    await patch(`events?id=eq.${id}`, { ignored_at: new Date().toISOString(), ignored_by: session.email });
    await del(`attendance?event_id=eq.${id}`);
    await del(`unmatched_signins?event_id=eq.${id}`);
    toast('Dismissed.');
    show('attention');
  }));

  root.querySelectorAll('[data-resolve]').forEach((b) => b.onclick = () => guard(async () => {
    const netid = el(`fix-${b.dataset.resolve}`).value.trim().toLowerCase();
    if (!netid) return toast('Enter a netID first.', true);
    await rpc('resolve_unmatched_signin', { p_id: Number(b.dataset.resolve), p_netid: netid });
    toast(`Attached to ${netid}.`);
    show('attention');
  }));

  // Search Rice's directory by the name the sign-in form captured, automatically — no click,
  // since the name is already sitting right there in "Who signed in". Results are CANDIDATES:
  // clicking one only fills the netID box, so an officer still presses Attach. The directory
  // cannot verify a name the way it can verify a netID, so a human makes every call.
  const showDirectoryResults = (id, found) => {
    directoryAutoSearchCache.set(id, found);
    renderCandidates(el(`cand-${id}`), found, (r) => {
      el(`fix-${id}`).value = r.netid;
      toast(`Filled ${r.netid}. Check it, then press Attach.`);
    });
  };
  unmatched.forEach((u) => {
    const id = String(u.id);
    const out = el(`cand-${id}`);
    const who = payloadName(u.raw_payload);
    if (!who) { out.innerHTML = '<span class="hint">No name to search — try "search a different spelling".</span>'; return; }
    const cached = directoryAutoSearchCache.get(id);
    if (cached) return showDirectoryResults(id, cached);
    out.innerHTML = '<span class="hint">Searching…</span>';
    edgeFn('directory-lookup', { mode: 'search', q: who }).then((found) => showDirectoryResults(id, found));
  });

  // Manual override for when the form's spelling doesn't match the directory: Enter re-runs the
  // search with whatever is typed here and replaces the cached (automatic) result for this row.
  root.querySelectorAll('.search-alt').forEach((input) => input.onkeydown = (e) => {
    if (e.key !== 'Enter') return;
    guard(async () => {
      const id = input.id.replace(/^q-/, '');
      const q = input.value.trim();
      if (!q) return toast('Type a name to search for.', true);
      el(`cand-${id}`).innerHTML = '<span class="hint">Searching…</span>';
      showDirectoryResults(id, await edgeFn('directory-lookup', { mode: 'search', q }));
    });
  });

  // Dismiss a sign-in nobody can attach — a personal email with no Rice identity behind it, or a
  // test submission. Soft on purpose: resolved_at marks it handled while resolved_netid stays
  // null, so it leaves the queue but the raw payload is kept. Undo is `set resolved_at = null`.
  root.querySelectorAll('[data-drop]').forEach((b) => b.onclick = () => guard(async () => {
    if (!confirm('Dismiss this sign-in? It leaves the queue and nobody is credited for it.\n\n'
               + 'What they submitted is kept, so this can be undone later.')) return;
    await patch(`unmatched_signins?id=eq.${b.dataset.drop}`, { resolved_at: new Date().toISOString() });
    toast('Dismissed.');
    show('attention');
  }));

  if (el('mf-set')) el('mf-set').onclick = () => guard(async () => {
    const id = el('mf-pick').value;
    if (!id) return toast('Choose a form first.', true);
    // Only the flag. The event keeps its own type and keeps paying whatever that type pays --
    // being the membership form is additive, which is the whole point of the column existing.
    await patch(`events?id=eq.${id}`, { collects_membership: true });
    toast('Set. The poller will re-read that form within 15 minutes and fill in demographics.');
    show('attention');
  });

  // Loops fill-names automatically until every nameless person has been tried once, rather than
  // making an officer press the button once per 25. Each call still only sends one batch of 25 to
  // Rice — that per-call ceiling and its 150ms-per-lookup pacing
  // (supabase/functions/_shared/directory.ts) are the real courtesy behaviour and stay unchanged;
  // looping just removes the manual re-press.
  //
  // The stopping condition is "tried everyone once", not "nothing left with no name" — those are
  // NOT the same thing. Someone whose directory listing is hidden never gets a name, so they never
  // leave the nameless pool; a loop that kept going `while (still somebody nameless)` would just
  // re-fetch that same unfillable person forever (alphabetically first, so `order by netid limit
  // 25` never gets past them) and hammer Rice's directory for no reason. `tried` is exactly the
  // `excludeNetids` the edge function needs to serve a DIFFERENT 25 each round instead.
  //
  // Each round writes straight to `people` before the next one starts (see the edge function), so
  // nothing is lost if an officer navigates away mid-run.
  if (el('lookup-names')) el('lookup-names').onclick = () => guard(async () => {
    const button = el('lookup-names');
    button.disabled = true;
    button.textContent = 'Looking up…';

    const total = nameless.length;
    const tried = new Set();
    let filled = 0, remaining = Infinity;
    try {
      while (tried.size < total) {
        const r = await withRetry(() => edgeFn('directory-lookup', {
          mode: 'fill-names', limit: 25, excludeNetids: [...tried],
        }));
        remaining = r.remaining;
        if (r.attempted === 0) break; // nothing left to read, whatever remaining last said
        r.attemptedNetids.forEach((id) => tried.add(id));
        r.noMatchNetids.forEach((id) => noDirectoryMatch.add(id));
        filled += r.filled;
        button.textContent = tried.size < total ? `Looked up ${tried.size} of ${total}…` : `Looked up ${tried.size}. Done.`;
      }
      toast(remaining > 0
        ? `Looked up ${tried.size}, filled ${filled}. ${remaining} still have no directory match — they may have hidden their listing.`
        : `Looked up ${tried.size}, filled ${filled}. None left.`, remaining > 0);
    } catch (e) {
      // A batch failed three times in a row (withRetry gave up). Report where the run stopped
      // rather than let guard()'s generic handler swallow the progress made so far.
      toast(`Stopped after looking up ${tried.size} (filled ${filled}): ${e.message.slice(0, 150)}`, true);
    }
    show('attention');
  });

  root.querySelectorAll('[data-name]').forEach((b) => b.onclick = () => guard(async () => {
    const netid = b.dataset.name;
    const first = el(`fn-${netid}`).value.trim(), last = el(`ln-${netid}`).value.trim();
    if (!first && !last) return toast('Enter at least one name.', true);
    await patch(`people?netid=eq.${encodeURIComponent(netid)}`, { first_name: first || null, last_name: last || null });
    toast(`Saved ${netid}.`);
    show('attention');
  }));

  // For someone worth giving up on -- most often a senior whose directory listing is gone for
  // good, so no amount of looking up will ever fill this in. Soft, like every other Dismiss in
  // this dashboard: nothing about the person or their points changes, this only drops them out of
  // the queue. Un-dismissing is `update people set name_lookup_dismissed_at = null` by hand.
  root.querySelectorAll('[data-namedismiss]').forEach((b) => b.onclick = () => guard(async () => {
    const netid = b.dataset.namedismiss;
    if (!confirm(`Dismiss ${netid} from "No name on file"? Their points are untouched -- this just `
               + 'stops asking to look up their name.')) return;
    await patch(`people?netid=eq.${encodeURIComponent(netid)}`, { name_lookup_dismissed_at: new Date().toISOString() });
    toast(`Dismissed ${netid}.`);
    show('attention');
  }));

  // Per-row lookup, for resolving one person without running the bulk pass. Rice's directory
  // search matches on netID as well as name, so searching by the netID already on file is enough
  // to find their record and read the name off it.
  root.querySelectorAll('[data-namesearch]').forEach((b) => b.onclick = () => guard(async () => {
    const netid = b.dataset.namesearch;
    const out = el(`ncand-${netid}`);
    out.innerHTML = '<span class="hint">Searching…</span>';
    const found = await edgeFn('directory-lookup', { mode: 'search', q: netid });
    if (!found.tooBroad && !found.results?.length) {
      noDirectoryMatch.add(netid);
      b.disabled = true;
      b.title = 'Already checked — the Rice directory has nothing for this netID.';
    }
    renderCandidates(out, found, (r) => {
      el(`fn-${netid}`).value = r.firstName || '';
      el(`ln-${netid}`).value = r.lastName || '';
      toast('Filled from the directory. Check it, then press Save.');
    });
  }));
}

// ---------------------------------------------------------------------------
// Screen: Events — every event there has ever been, grouped by academic year.
//
// This screen exists because there was nowhere to see an event once it had been typed. It left
// Needs attention and became invisible: no list, no history, no way back. That is not a cosmetic
// gap. 2025-08-28 existed as TWO events for a year — a spreadsheet import and the poller's
// form-backed copy — and nobody could have noticed, because after typing, neither was on screen
// anywhere. It is also where a dismissed event gets a second chance, and where the year's
// membership form can be handed to a different event.
//
// Browse-first: the only things that mutate here are the ones with nowhere else to live.
// ---------------------------------------------------------------------------
async function renderEvents(root) {
  const [years, events, logged] = await Promise.all([
    get('academic_years?select=id,starts_on,ends_on&order=starts_on.desc'),
    get('events?select=id,name,occurred_on,type_code,points,source,ignored_at,ignored_by,collects_membership,forms(form_id)&order=occurred_on.desc'),
    // Every count on this screen in one query. An `in.(...)` list of event ids would work today and
    // get longer every year until it hits a URL limit; the whole ledger is a few thousand narrow
    // rows and is what Standings already pulls. Tallied client-side below.
    get('attendance?select=event_id,points_awarded'),
  ]);

  const tally = new Map();
  for (const a of logged) {
    const t = tally.get(String(a.event_id)) || { people: 0, points: 0 };
    t.people += 1;
    t.points += Number(a.points_awarded) || 0;
    tally.set(String(a.event_id), t);
  }

  const typeLabel = (code) => state.eventTypes.find((t) => t.code === code)?.label;

  // Events belong to a year only by date — there is no year_id on the table (see
  // 20260731024857_new_schema.sql), which is the same reason v_points_ledger derives one. Anything
  // outside every year still has to appear, or this screen would hide exactly the misdated event
  // an officer came here to find.
  const groups = years.map((y) => ({
    id: y.id,
    events: events.filter((e) => e.occurred_on >= y.starts_on && e.occurred_on <= y.ends_on),
  }));
  const orphans = events.filter((e) => !years.some((y) => e.occurred_on >= y.starts_on && e.occurred_on <= y.ends_on));
  if (orphans.length) groups.push({ id: 'Outside any academic year', events: orphans, orphan: true });

  const row = (e) => {
    const t = tally.get(String(e.id)) || { people: 0, points: 0 };
    const dismissed = !!e.ignored_at;
    return `
      <tr${dismissed ? ' class="dim"' : ''}>
        <td>${esc(e.occurred_on)}</td>
        <td>
          ${eventLink(e.name, e.forms?.[0]?.form_id)}
          ${e.source === 'manual' ? '<span class="pill">manual</span>' : ''}
          ${e.collects_membership ? '<span class="pill mf">membership form</span>' : ''}
          ${dismissed ? '<span class="pill">not an event</span>' : ''}
        </td>
        <td>
          <select data-settype="${esc(e.id)}"${dismissed ? ' disabled' : ''}>
            <option value=""${e.type_code ? '' : ' selected'}>&mdash; none &mdash;</option>
            ${state.eventTypes.map((ty) => `<option value="${esc(ty.code)}"${ty.code === e.type_code ? ' selected' : ''}>${esc(ty.label)}</option>`).join('')}
          </select>
        </td>
        <td class="num">${t.people}</td>
        <td class="num">${Math.round(t.points * 100) / 100}</td>
        <td class="row">
          ${e.collects_membership ? `<button class="ghost" data-clearmf="${esc(e.id)}">Clear</button>` : ''}
          ${dismissed ? `<button class="ghost" data-restore="${esc(e.id)}">Restore</button>` : ''}
        </td>
      </tr>`;
  };

  // The global year selector otherwise changed nothing visible here: every year's events were
  // always rendered, just collapsed, so switching years meant scrolling to see which card opened.
  // The current year's card is now the only one shown by default; every other year (and anything
  // outside every year — the orphan bucket above) sits behind an explicit "Show other years"
  // toggle, so switching years in the header visibly changes what this screen shows.
  const groupCard = (g) => detailsCard(
    `events-${g.id}`, g.events.length,
    `${esc(g.id)} ${countTag(g.events.length, false)}`,
    g.events.length === 0 ? '<div class="empty">No events.</div>' : `
    <div class="scroll"><table>
      <thead><tr><th>Date</th><th>Event</th><th>Type</th><th>People</th><th>Points</th><th></th></tr></thead>
      <tbody>${g.events.map(row).join('')}</tbody>
    </table></div>`,
    g.id === state.currentYear);

  const currentGroup = groups.find((g) => g.id === state.currentYear);
  const otherGroups = groups.filter((g) => g !== currentGroup);
  const otherCount = otherGroups.reduce((n, g) => n + g.events.length, 0);

  root.innerHTML = `
    ${currentGroup ? groupCard(currentGroup) : '<div class="card"><div class="empty">No current academic year selected.</div></div>'}
    ${otherGroups.length === 0 ? '' : `
    <div class="card" style="padding-top:14px">
      <button class="ghost" id="ev-toggle-others">${state.eventsShowOthers
        ? 'Hide other years'
        : `Show other years &amp; out-of-range events (${otherCount})`}</button>
    </div>`}
    ${state.eventsShowOthers ? otherGroups.map(groupCard).join('') : ''}`;

  wireCollapsibles(root);

  if (el('ev-toggle-others')) el('ev-toggle-others').onclick = () => {
    state.eventsShowOthers = !state.eventsShowOthers;
    show('events');
  };

  root.querySelectorAll('[data-settype]').forEach((sel) => sel.onchange = () => guard(async () => {
    const code = sel.value || null;
    // show() re-renders from the database, so a cancelled confirm puts the select back where it was
    // without any DOM bookkeeping here.
    if (code && isMembershipType(code) && !confirmMembershipType()) return show('events');
    // points: null lets events_default_points fill it from the type. Clearing the type zeroes
    // everyone's points but keeps their rows, and re-typing pays them again -- the same
    // "forgetting the type delays points, it never loses them" guarantee, run backwards.
    await patch(`events?id=eq.${sel.dataset.settype}`, { type_code: code, points: null });
    toast(code ? `Set to ${typeLabel(code)}.` : 'Type cleared. It is back in Needs attention.');
    show('events');
  }));

  root.querySelectorAll('[data-clearmf]').forEach((b) => b.onclick = () => guard(async () => {
    if (!confirm('Stop this form collecting membership information?\n\n'
               + 'Everything already collected is kept. The year will show as having no membership '
               + 'form until another one is picked, which is how you hand it to a different event.')) return;
    await patch(`events?id=eq.${b.dataset.clearmf}`, { collects_membership: false });
    toast('Cleared. Pick the new one in Needs attention.');
    show('events');
  }));

  // Un-dismissing. Clearing ignored_at is only half of it: dismissing DELETED the event's
  // attendance, so without resetting the form's high-water mark the event would come back empty
  // and look restored while paying nobody. Nulling last_response_at makes the poller re-send the
  // form's whole history on its next pass, which is the same mechanism the membership replay uses.
  root.querySelectorAll('[data-restore]').forEach((b) => b.onclick = () => guard(async () => {
    const id = b.dataset.restore;
    if (!confirm('Restore this as a real event?\n\n'
               + 'Its form will be read again from the beginning, so sign-ins recorded before it was '
               + 'dismissed come back. Give the poller about 15 minutes.')) return;
    await patch(`events?id=eq.${id}`, { ignored_at: null, ignored_by: null });
    await patch(`forms?event_id=eq.${id}`, { last_response_at: null });
    toast('Restored. Its sign-ins come back within 15 minutes.');
    show('events');
  }));
}

// ---------------------------------------------------------------------------
// Screen: Volunteering — the one place an officer enters data directly.
// ---------------------------------------------------------------------------
async function renderVolunteering(root) {
  const events = await get("events?type_code=eq.volunteer&select=id,name,occurred_on&order=occurred_on.desc&limit=25");

  // Every count on this page in one query, aggregated here. Needs-attention fetches its counts
  // with a request per row; at 25 rows that pattern would be 25 round trips.
  const logged = events.length
    ? await get(`attendance?event_id=in.(${events.map((e) => encodeURIComponent(e.id)).join(',')})&select=event_id,hours`)
    : [];
  const tally = new Map();
  for (const a of logged) {
    const t = tally.get(String(a.event_id)) || { people: 0, hours: 0 };
    t.people += 1;
    t.hours += Number(a.hours) || 0;
    tally.set(String(a.event_id), t);
  }

  // The selected event is normally in the list above. It is not when its date puts it outside
  // the 25 most recent, which happens when an officer backfills an older event, so fetch it.
  let selected = events.find((e) => String(e.id) === String(state.volunteerEventId)) || null;
  if (!selected && state.volunteerEventId) {
    const [found] = await get(`events?id=eq.${encodeURIComponent(state.volunteerEventId)}&select=id,name,occurred_on`);
    selected = found || null;
    if (!found) state.volunteerEventId = null;
  }

  root.innerHTML = `
    <div class="card">
      <h2>Create a volunteer event</h2>
      <div class="row">
        <input id="v-name" placeholder="Event name" size="30">
        <input id="v-date" type="date" value="${new Date().toISOString().slice(0, 10)}">
        <button class="act" id="v-create">Create</button>
      </div>
    </div>

    <div class="card">
      <h2>Volunteer events ${countTag(events.length, false)}</h2>
      ${events.length === 0 ? '<div class="empty">None yet.</div>' : `
      <div class="scroll"><table>
        <thead><tr><th>Date</th><th>Event</th><th>People recorded</th><th>Total hours</th></tr></thead>
        <tbody>${events.map((e) => {
          const t = tally.get(String(e.id)) || { people: 0, hours: 0 };
          return `
          <tr class="pick" data-pick="${esc(e.id)}">
            <td>${esc(e.occurred_on)}</td>
            <td>${esc(e.name)}</td>
            <td class="num">${t.people}</td>
            <td class="num">${Math.round(t.hours * 100) / 100}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>`}
    </div>

    <div class="card" id="v-entry" hidden>
      <h2>Enter hours <span class="ctx" id="v-active"></span></h2>
      <textarea id="v-paste" placeholder="netid&#9;hours&#10;dr56&#9;3&#10;mac50&#9;1.5"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="act" id="v-commit" disabled>Commit</button>
      </div>
      <div id="v-result"></div>
    </div>`;

  const lookup = (id) => events.find((e) => String(e.id) === String(id))
    || (selected && String(selected.id) === String(id) ? selected : null);

  /** Selecting is a DOM update, not a re-render, so anything already pasted survives it. */
  function select(id) {
    const ev = id == null ? null : lookup(id);
    state.volunteerEventId = ev ? ev.id : null;
    root.querySelectorAll('[data-pick]').forEach((tr) =>
      tr.classList.toggle('picked', !!ev && String(tr.dataset.pick) === String(ev.id)));
    el('v-entry').hidden = !ev;
    if (ev) el('v-active').textContent = `${ev.occurred_on} · ${ev.name}`;
  }

  // Clicking the selected row again closes the entry section: the row is the toggle, so there
  // is nothing extra on screen for getting back out of it.
  root.querySelectorAll('[data-pick]').forEach((tr) => tr.onclick = () =>
    select(String(state.volunteerEventId) === tr.dataset.pick ? null : tr.dataset.pick));

  el('v-create').onclick = () => guard(async () => {
    const name = el('v-name').value.trim();
    if (!name) return toast('Name the event first.', true);
    // return=representation so the new event can be selected without hunting for it again.
    const [created] = await post('events', {
      name, occurred_on: el('v-date').value, type_code: 'volunteer',
      source: 'manual', created_by: session.email,
    }, 'return=representation') || [];
    state.volunteerEventId = created ? created.id : null;
    toast('Volunteer event created.');
    show('volunteering');
  });

  let checked = [];
  let checkTimer;

  // Rows are checked as they are typed or pasted rather than behind a button. The check itself
  // is not optional: resolving every netID against `people` before anything is written is what
  // keeps a typo from becoming an orphan row, and Commit stays disabled until it passes.
  async function check() {
    const parsed = parsePaste(el('v-paste').value);
    if (!parsed.length) {
      checked = [];
      el('v-result').innerHTML = '';
      el('v-commit').disabled = true;
      return;
    }

    const ids = [...new Set(parsed.map((p) => p.raw))].filter(Boolean);
    const known = ids.length
      ? await get(`people?netid=in.(${ids.map(encodeURIComponent).join(',')})&select=netid`)
      : [];
    const knownSet = new Set(known.map((k) => k.netid));

    checked = parsed.map((p) => ({ ...p, ok: knownSet.has(p.raw) && Number.isFinite(p.hours) && p.hours > 0 }));
    const bad = checked.filter((c) => !c.ok).length;

    el('v-result').innerHTML = `
      <div class="scroll" style="margin-top:16px"><table>
        <thead><tr><th>netID</th><th>Hours</th><th>Status</th></tr></thead>
        <tbody>${checked.map((c) => `
          <tr>
            <td><code>${esc(c.raw || '(blank)')}</code></td>
            <td class="num">${Number.isFinite(c.hours) ? c.hours : '<span class="err">?</span>'}</td>
            <td>${c.ok ? '<span class="ok">ok</span>'
                        : `<span class="err">${!knownSet.has(c.raw) ? 'no such netID' : 'bad hours'}</span>`}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
      <p class="hint" style="margin-top:12px">
        ${checked.length - bad} ready${bad ? ` &middot; <span class="err">${bad} need fixing</span>` : ''}
      </p>`;
    el('v-commit').disabled = bad > 0 || checked.length === 0;
  }

  el('v-paste').oninput = () => {
    clearTimeout(checkTimer);
    el('v-commit').disabled = true;   // nothing is committable while the text is still moving
    checkTimer = setTimeout(() => guard(check), 300);
  };

  el('v-commit').onclick = () => guard(async () => {
    if (!state.volunteerEventId) return toast('Pick an event first.', true);
    // hours drives points via the attendance_hours_to_points trigger — one rule, in one place.
    await post('attendance?on_conflict=event_id,netid',
      checked.map((c) => ({ event_id: state.volunteerEventId, netid: c.raw, hours: c.hours, source: 'manual' })),
      'resolution=merge-duplicates');
    toast(`Recorded ${checked.length} volunteer row(s).`);
    show('volunteering');
  });

  select(state.volunteerEventId);
}

// ---------------------------------------------------------------------------
// Paste parsing
//
// These rows become hours, hours become points, and points decide who gets sponsored, so a
// silently wrong number is far worse than a rejected one. Everything below prefers to hand a
// row to Preview as an error rather than guess at it.
// ---------------------------------------------------------------------------

/**
 * netid shape: a letter, then letters, digits, dots, hyphens or underscores. Dots and trailing
 * digits are both deliberate: a few identities on this roster are personal-email local parts
 * rather than true netIDs, and a stricter pattern silently dropped them. Rules out names (they
 * contain a space), dates and free text.
 *
 * No real netID appears in this file on purpose. This page is served publicly, so anyone can
 * read its source, and docs/DESIGN.md is explicit that a netID is a Rice identifier with no
 * business on a public endpoint. Keep examples invented.
 */
const NETID_LIKE = /^[a-z][a-z0-9._-]{1,30}$/i;

/** Column headers people paste along with the data, which should be skipped, not flagged. */
const isHeaderRow = (fields) => fields.some((f) => /^net\s*id$/i.test(f) || /^hours?$/i.test(f));

/**
 * A number, allowing a comma as the decimal mark: a Sheet in a European locale writes 1,5 for
 * an hour and a half. Only one or two digits may follow it, so 1,500 stays ambiguous and is
 * rejected rather than read as 1.5.
 */
function hoursValue(field) {
  const n = Number(/^\d+,\d{1,2}$/.test(field) ? field.replace(',', '.') : field);
  return Number.isFinite(n) ? n : NaN;
}

function parsePaste(text) {
  return text.split('\n').map((l) => l.trim()).filter(Boolean).flatMap((line) => {
    // Sheets always puts tabs on the clipboard, so a tab wins wherever one appears. Comma is
    // only for hand-typed input, and splitting on both would turn "dr56<tab>1,5" into 1 hour.
    const fields = (line.includes('\t') ? line.split('\t') : line.split(','))
      .map((f) => f.trim()).filter(Boolean);
    if (!fields.length || isHeaderRow(fields)) return [];

    // Hours is the last field that reads as a number: in "Diego Rico, dr56, 3" that is 3, and
    // a netid ending in digits earlier in the row cannot be mistaken for it.
    let hoursAt = -1;
    for (let i = fields.length - 1; i >= 0; i--) {
      if (Number.isFinite(hoursValue(fields[i]))) { hoursAt = i; break; }
    }

    // The identifier is an email if there is one, otherwise the netid-shaped field closest to
    // the hours. Closest, because "Diego, Rico, dr56, 3" has three fields of netid shape.
    const before = fields.filter((_, i) => i !== hoursAt);
    const email = before.find((f) => f.includes('@'));
    const netid = [...before].reverse().find((f) => NETID_LIKE.test(f));
    const raw = (email ? email.split('@')[0] : netid || '').trim().toLowerCase();

    return [{ raw, hours: hoursAt === -1 ? NaN : hoursValue(fields[hoursAt]) }];
  });
}

// ---------------------------------------------------------------------------
// Screen: Standings — presents data, recommends nobody.
// ---------------------------------------------------------------------------
async function renderStandings(root) {
  // The all-time set, loaded once. It seeds the facet dropdowns and is what the "All time" range
  // shows. member_totals_between(null, null) is the same query v_member_totals runs, so this is
  // also the check that the ranged function agrees with the view it was derived from.
  const [allTime, roleHolders, years] = await Promise.all([
    rpc('member_totals_between', { p_from: null, p_to: null }),
    get(`roles?year_id=eq.${state.currentYear}&select=netid`),
    get('academic_years?select=id,starts_on,ends_on,convention_on&order=starts_on.desc'),
  ]);
  const eboard = new Set(roleHolders.map((r) => r.netid));

  // Major, gender and class level are NULL for everyone until the annual membership form has
  // been ingested, so these open to nothing on a fresh database. That is a data gap, not a
  // defect, and a disabled control saying so beats a dropdown that appears broken.
  //
  // Built from the ALL-TIME set and never rebuilt when the range changes. Rebuilding would drop
  // whichever option the officer had selected the moment they picked a range nobody in that major
  // had points in, silently resetting their filter. A major that exists is a valid thing to filter
  // by whether or not anyone scored in the window.
  const facet = (id, key, all) => {
    const opts = [...new Set(allTime.map((t) => t[key]).filter(Boolean))].sort();
    return opts.length
      ? `<select id="${id}"><option value="">${all}</option>${opts.map((v) => `<option>${esc(v)}</option>`).join('')}</select>`
      : `<select id="${id}" disabled><option value="">No membership data yet</option></select>`;
  };

  // The convention is the deliberation landmark: "how many points since we last went?" It is
  // recorded per year because the date moves, and falls back to 30 October of the fall semester
  // when nobody has filled it in — close enough to be useful, and editable in the year settings.
  const conventionOf = (y) => y.convention_on || `${String(y.starts_on).slice(0, 4)}-10-30`;

  const currentYear = years.find((y) => y.id === state.currentYear) || years[0];

  // Presets are derived from the academic years in the database rather than hardcoded, so they
  // stay right when the calendar shifts. Each is [from, to]; null means open-ended.
  const presets = {
    all: { label: 'All time', range: [null, null] },
    ...(currentYear ? {
      year: { label: `This year (${currentYear.id})`, range: [currentYear.starts_on, currentYear.ends_on] },
      fall: { label: 'Fall semester', range: [currentYear.starts_on, `${String(currentYear.starts_on).slice(0, 4)}-12-31`] },
      spring: { label: 'Spring semester', range: [`${Number(String(currentYear.starts_on).slice(0, 4)) + 1}-01-01`, currentYear.ends_on] },
      convention: { label: 'Since last convention', range: [conventionOf(currentYear), null] },
    } : {}),
  };

  root.innerHTML = `
    <div class="card">
      <h2>Standings</h2>
      <div class="row" style="margin-bottom:12px">
        <select id="f-preset">${Object.entries(presets)
          .map(([k, p]) => `<option value="${k}">${esc(p.label)}</option>`).join('')}
          <option value="custom">Custom range…</option>
        </select>
        <label class="check">from <input type="date" id="f-from"></label>
        <label class="check">to <input type="date" id="f-to"></label>
        <span id="f-range-note" class="hint"></span>
      </div>
      <div class="row" style="margin-bottom:16px">
        ${facet('f-major', 'major', 'All majors')}
        ${facet('f-gender', 'gender', 'All genders')}
        ${facet('f-class', 'class_level', 'All class levels')}
        <select id="f-membership">
          <option value="">Any membership</option>
          <option value="member">This year's member</option>
          <option value="missing">Missing this year's form</option>
        </select>
        <label class="check"><input type="checkbox" id="f-noeboard"> exclude eboard &amp; chairs</label>
        <label class="check"><input type="checkbox" id="f-nobonus"> exclude role bonuses</label>
        <span class="spacer"></span>
        <button class="ghost" id="f-csv">Download CSV</button>
      </div>
      <div id="standings-out" class="scroll"></div>
    </div>`;

  let totals = allTime;
  let range = [null, null];
  let view = [];
  function draw() {
    const major = el('f-major').value, gender = el('f-gender').value, cls = el('f-class').value;
    const membership = el('f-membership').value;
    const noEboard = el('f-noeboard').checked, noBonus = el('f-nobonus').checked;

    view = totals
      .filter((t) => (!major || t.major === major) && (!gender || t.gender === gender) && (!cls || t.class_level === cls))
      // "This year's member" is just is_current_member. "Missing this year's form" mirrors what
      // the old Roster screen's queue meant: not a current member AND has SOME points in the
      // range shown — otherwise every person who has simply never shown up would count as
      // "missing", which is not an actionable list. That is also why f-membership's onchange
      // (below) defaults the range to this year: is_current_member always reflects this year
      // regardless of range, so pairing it with all-time points reproduces the inflated,
      // unwindowed count the old Roster screen had.
      .filter((t) => membership === 'member' ? t.is_current_member
                    : membership === 'missing' ? !t.is_current_member && Number(t.total_points) > 0
                    : true)
      .filter((t) => !noEboard || !eboard.has(t.netid))
      .map((t) => ({ ...t, shown: Number(t.total_points) - (noBonus ? Number(t.points_from_role) : 0) }))
      .sort((a, b) => b.shown - a.shown);

    el('standings-out').innerHTML = `
      <table>
        <thead><tr>
          <th>#</th><th>Name</th><th>netID</th><th>Points</th>
          <th>Events</th><th>Role</th><th>Manual</th>
          <th>Major</th><th>Gender</th><th>Class</th><th>Member</th><th>Last active</th>
        </tr></thead>
        <tbody>${view.map((t, i) => `
          <tr>
            <td class="none">${i + 1}</td>
            <td>${esc([t.first_name, t.last_name].filter(Boolean).join(' ')) || '<span class="err">no name on file</span>'}</td>
            <td><code>${esc(t.netid)}</code></td>
            <td class="num"><strong>${t.shown}</strong></td>
            <td class="num">${t.points_from_events}</td>
            <td class="num">${t.points_from_role}</td>
            <td class="num">${t.points_from_adjustments}</td>
            <td>${t.major ? esc(t.major) : blank()}</td>
            <td>${t.gender ? esc(t.gender) : blank()}</td>
            <td>${t.class_level ? esc(t.class_level) : blank()}</td>
            <td>${t.is_current_member ? 'Yes' : 'No'}</td>
            <td>${t.last_activity ? esc(t.last_activity) : blank('never')}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <p class="hint" style="margin-top:14px">${view.length} people shown${
        range[0] || range[1]
          ? `, counting points from ${range[0] ? esc(range[0]) : 'the beginning'} to ${range[1] ? esc(range[1]) : 'today'}.
             Role bonuses count for the whole academic year they were awarded in, so they appear in
             any range that overlaps that year.`
          : '.'}${
        membership && !range[0] && !range[1]
          ? ' <strong>Showing all-time points</strong> — Membership always reflects this year only, '
            + 'so pick "This year" (or another range) above for a count that lines up with it.'
          : ''}</p>`;
  }

  /**
   * Load a range and redraw. Async because the aggregation happens in Postgres, not here — the
   * ledger is already past PostgREST's 1000-row response cap, so summing it in the browser would
   * silently drop rows and quietly under-report people's points.
   */
  let seq = 0;
  async function applyRange(from, to) {
    const mine = ++seq;
    const out = el('standings-out');
    out.innerHTML = '<p class="hint">Loading…</p>';
    const rows = await rpc('member_totals_between', { p_from: from || null, p_to: to || null });
    // Two quick clicks on different presets can come back out of order, and the slower first
    // response would then overwrite the fresher second one with numbers for the wrong range.
    if (mine !== seq) return;
    totals = rows;
    range = [from || null, to || null];
    draw();
  }

  ['f-major', 'f-gender', 'f-class', 'f-noeboard', 'f-nobonus'].forEach((id) => el(id).onchange = draw);

  // Whether the officer has already chosen a range themselves (any preset, or a custom date) —
  // once true, the Membership facet stops nudging the range and just filters whatever is loaded.
  let rangePicked = false;

  el('f-preset').onchange = () => guard(async () => {
    rangePicked = true;
    const chosen = presets[el('f-preset').value];
    if (!chosen) return; // "Custom range…" — the officer drives the date boxes themselves
    const [from, to] = chosen.range;
    el('f-from').value = from || '';
    el('f-to').value = to || '';
    await applyRange(from, to);
  });

  ['f-from', 'f-to'].forEach((id) => el(id).onchange = () => guard(async () => {
    rangePicked = true;
    el('f-preset').value = 'custom';
    await applyRange(el('f-from').value, el('f-to').value);
  }));

  // Selecting a Membership value while still on the untouched default (all-time) range switches
  // to "This year" first: is_current_member always reflects this year, and pairing it with
  // all-time points is what made the old Roster screen's "missing" list count everyone with any
  // historical points rather than the ~66 people who actually missed this year's form. Once the
  // officer has picked a range of their own, this defers to that choice.
  el('f-membership').onchange = () => guard(async () => {
    const active = el('f-membership').value;
    if (active && !rangePicked && currentYear && el('f-preset').value === 'all') {
      el('f-preset').value = 'year';
      el('f-from').value = currentYear.starts_on;
      el('f-to').value = currentYear.ends_on;
      await applyRange(currentYear.starts_on, currentYear.ends_on);
    } else {
      draw();
    }
  });

  el('f-csv').onclick = () => {
    const rows = [['name', 'netid', 'points', 'events', 'role', 'manual', 'major', 'gender', 'class', 'member']]
      .concat(view.map((t) => [
        [t.first_name, t.last_name].filter(Boolean).join(' '), t.netid, t.shown,
        t.points_from_events, t.points_from_role, t.points_from_adjustments,
        t.major || '', t.gender || '', t.class_level || '', t.is_current_member ? 'yes' : 'no',
      ]));
    const csv = rows.map((r) => r.map((c) => /[",]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    // The filename carries the range, so two exports taken for different windows do not land in
    // the officer's downloads folder as indistinguishable files.
    a.download = range[0] || range[1]
      ? `shpe-standings-${range[0] || 'start'}_${range[1] || 'today'}.csv`
      : 'shpe-standings-all-time.csv';
    a.click();
  };
  draw();
}

            <td><button class="ghost" data-drop="${esc(r.netid)}|${esc(r.role)}">Remove</button></td>

      netid, year_id: state.currentYear, role: el('r-role').value,
      position_title: el('r-title').value.trim() || null,

    const [netid, role] = b.dataset.drop.split('|');
    await del(`roles?netid=eq.${encodeURIComponent(netid)}&year_id=eq.${state.currentYear}&role=eq.${role}`);
    toast(`Removed ${netid}. Re-apply bonuses to withdraw the points.`);

  el('r-apply').onclick = () => guard(async () => {
    const applied = await rpc('apply_role_bonuses', { p_year_id: state.currentYear });
    toast(`Applied bonuses to ${applied.length} person(s).`);
  });
}
