// Screen: Officers — who can sign in to this dashboard at all.
//
// No migration behind this screen: `officers` already carries a blanket RLS policy
// (officers_all) letting any signed-in officer insert/update/delete rows in it, so this is a
// pure UI addition. Modeled directly on renderRoles' table+add-row pattern above.
// ---------------------------------------------------------------------------
async function renderOfficers(root) {
  const officers = await get('officers?select=email,display_name,active&order=active.desc,email');

  root.innerHTML = `
    <div class="card">
      <h2>Officers ${countTag(officers.filter((o) => o.active).length, false)}</h2>
      <div class="row" style="margin-bottom:16px">
        <input id="o-email" placeholder="email" size="26">
        <input id="o-name" placeholder="Display name (optional)" size="22">
        <button class="act" id="o-add">Add</button>
      </div>
      ${officers.length === 0 ? '<div class="empty">No officers on file.</div>' : `
      <div class="scroll"><table>
        <thead><tr><th>Email</th><th>Name</th><th></th></tr></thead>
        <tbody>${officers.map((o) => `
          <tr${o.active ? '' : ' class="dim"'}>
            <td>${esc(o.email)}</td>
            <td>${o.display_name ? esc(o.display_name) : blank()}</td>
            <td class="row actions">
              ${o.active ? '<span class="pill">active</span>' : '<span class="pill">inactive</span>'}
              ${o.active
                ? `<button class="ghost" data-remove="${esc(o.email)}">Remove</button>`
                : `<button class="ghost" data-restore="${esc(o.email)}">Restore</button>`}
            </td>
          </tr>`).join('')}</tbody>
      </table></div>`}
    </div>`;

  el('o-add').onclick = () => guard(async () => {
    const email = el('o-email').value.trim().toLowerCase();
    const name = el('o-name').value.trim();
    if (!email) return toast('Enter an email.', true);
    // merge-duplicates so re-adding a removed officer's email flips active back to true instead
    // of erroring on the primary key.
    await post('officers?on_conflict=email', [{ email, display_name: name || null, active: true }], 'resolution=merge-duplicates');
    toast(`Added ${email}.`);
    show('officers');
  });

  // Soft removal, matching the documented runbook step (docs/RUNBOOK.md) and how the rest of this
  // codebase treats access changes: active=false keeps the row (and its history) rather than
  // deleting it, and is shown dimmed rather than hidden, the same way a dismissed event is on the
  // Events screen.
  root.querySelectorAll('[data-remove]').forEach((b) => b.onclick = () => guard(async () => {
    if (!confirm(`Remove ${b.dataset.remove}'s dashboard access?`)) return;
    await patch(`officers?email=eq.${encodeURIComponent(b.dataset.remove)}`, { active: false });
    toast('Removed.');
    show('officers');
  }));

  root.querySelectorAll('[data-restore]').forEach((b) => b.onclick = () => guard(async () => {
    await patch(`officers?email=eq.${encodeURIComponent(b.dataset.restore)}`, { active: true });
    toast('Restored.');
    show('officers');
  }));
}

/** Inline so the file stays dependency-free. Sized in em so it tracks the row's font. */
const GEAR =
  '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" ' +
  'stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/>' +

  '1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 ' +
  '1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 ' +

  '1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';

/** Switch the current year. Every screen keys off it, so re-render whatever is open. */
async function setCurrentYear(id) {
  await patch('app_config?key=eq.current_year_id', { value: id });
  state.currentYear = id;
  el('year-pill').textContent = id;
  closeYearMenu();
  toast(`${id} is now the current year.`);
  show(state.tab);
}

function closeYearMenu() {
  const menu = el('year-menu');
  if (!menu) return;
  menu.hidden = true;
  el('year-pill').setAttribute('aria-expanded', 'false');
  document.removeEventListener('click', onDocClickForYearMenu, true);
}

/** Any click outside the switcher dismisses it, the way a menu is expected to behave. */
function onDocClickForYearMenu(e) {
  if (!e.target.closest('.yearsel')) closeYearMenu();
}

async function toggleYearMenu() {
  const menu = el('year-menu');
  if (!menu.hidden) return closeYearMenu();

  const years = await get('academic_years?select=id,starts_on,ends_on,forms_folder_id,convention_on&order=starts_on.desc');

  menu.innerHTML = `
    ${years.map((y) => `
      <div class="menurow">
        <button class="pick${y.id === state.currentYear ? ' is-current' : ''}" role="menuitem"
                data-year="${esc(y.id)}">${esc(y.id)}</button>
        <button class="gear" data-config="${esc(y.id)}" aria-label="Configure ${esc(y.id)}">${GEAR}</button>
      </div>`).join('')}
    <div class="sep"></div>
    <button role="menuitem" id="y-new">Start a new academic year</button>`;

  menu.querySelectorAll('[data-year]').forEach((b) => b.onclick = () => guard(async () => {
    if (b.dataset.year === state.currentYear) return closeYearMenu();
    await setCurrentYear(b.dataset.year);
  }));
  menu.querySelectorAll('[data-config]').forEach((b) => b.onclick = () => {
    const y = years.find((v) => v.id === b.dataset.config);
    closeYearMenu();
    openYearDialog(y);
  });
  el('y-new').onclick = () => { closeYearMenu(); openYearDialog(null); };

  menu.hidden = false;
  el('year-pill').setAttribute('aria-expanded', 'true');
  // Capture phase, so the listener sees the click before a re-render detaches the target.
  document.addEventListener('click', onDocClickForYearMenu, true);
}

/** Null opens the create form; a year row opens the same dialog to edit that year. */
let editingYear = null;

function openYearDialog(year) {
  editingYear = year;
  const d = el('year-dialog');

  el('y-id').value = year ? year.id : '';
  el('y-start').value = year ? year.starts_on : '';
  el('y-end').value = year ? year.ends_on : '';
  el('y-folder').value = year ? (year.forms_folder_id || '') : '';
  el('y-convention').value = year ? (year.convention_on || '') : '';

  // The year ID is the primary key every membership, role and bonus row points at. Renaming it
  // is a real operation, not a settings tweak, so it is read-only once the year exists.
  el('y-id').disabled = !!year;
  // Switching years is what clicking the row does. Offering it here too would be two paths to
  // one action, which is how two behaviours drift apart.
  el('y-current-row').hidden = !!year;
  el('y-current').checked = true;

  el('y-title').textContent = year ? `Configure ${year.id}` : 'Start a new academic year';
  el('y-save').textContent = year ? 'Save' : 'Create year';
  d.showModal();
}

function wireYearDialog() {
  const d = el('year-dialog');
  el('y-cancel').onclick = () => d.close();

  el('y-save').onclick = () => guard(async () => {
    const startsOn = el('y-start').value;
    const endsOn = el('y-end').value;
    const folder = el('y-folder').value.trim() || null;
    // Optional. Left blank, the Standings "since last convention" preset falls back to 30 October.
    const convention = el('y-convention').value || null;

    if (editingYear) {
      if (!startsOn || !endsOn) return toast('Start and end dates are both required.', true);
      await patch(`academic_years?id=eq.${encodeURIComponent(editingYear.id)}`,
        { starts_on: startsOn, ends_on: endsOn, forms_folder_id: folder, convention_on: convention });
      d.close();
      toast(`Saved ${editingYear.id}.`);
      return show(state.tab);
    }

    const id = el('y-id').value.trim();
    if (!id || !startsOn || !endsOn) return toast('Year, start date and end date are all required.', true);
    // p_copy_bonuses_from is deliberately omitted: the RPC defaults to the most recently started
    // year, which is what "role bonus values carry over" means. Roles and memberships are never
    // copied, per docs/DESIGN.md and the migration itself.
    await rpc('create_academic_year', {
      p_id: id, p_starts_on: startsOn, p_ends_on: endsOn,
      p_forms_folder_id: folder, p_make_current: el('y-current').checked,
    });
    if (el('y-current').checked) {
      state.currentYear = id;
      el('year-pill').textContent = id;
    }
    d.close();
    toast(`Created ${id}.`);
    show(state.tab);
  });
}

// ---------------------------------------------------------------------------
// Shell
// ---------------------------------------------------------------------------
const SCREENS = {
  attention: renderAttention, events: renderEvents, volunteering: renderVolunteering, standings: renderStandings,
  roles: renderRoles, adjustments: renderAdjustments, officers: renderOfficers, audit: renderAuditLog,
};

async function show(tab) {
  state.tab = tab;
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.tab === tab)));
  const out = el('screen');
  out.innerHTML = '<div class="card"><div class="empty">Loading…</div></div>';
  await guard(() => SCREENS[tab](out));
}

async function boot() {
  session = readSession();
  const app = el('app');

  if (!session) {
    app.innerHTML = `
      <div class="signin">
        ${logoMark()}
        <h1 class="sr-only">SHPE Points</h1>
        <p>Officer dashboard. Sign in with the Google account on the officer list.</p>
        <button class="act" id="signin" style="width:100%">Sign in with Google</button>
      </div>`;
    el('signin').onclick = signIn;
    return;
  }

  app.innerHTML = `
    <header>
      <!-- The lockup already reads "SHPE ... Rice University", so a wordmark beside it repeats
           itself. The heading stays for screen readers and the document outline. -->
      <h1 class="sr-only">SHPE Points</h1>
      <span class="mark">${logoMark()}</span>
      <span class="yearsel">
        <button class="pill" id="year-pill" aria-haspopup="menu" aria-expanded="false"></button>
        <div class="menu" id="year-menu" role="menu" hidden></div>
      </span>
      <span class="spacer"></span>
      <span class="who">${esc(session.email)}</span>
      <button class="ghost" id="signout">Sign out</button>
    </header>
    <nav>${TABS.map(([id, label]) => `<button data-tab="${id}">${label}</button>`).join('')}</nav>
    <main id="screen"></main>`;

  el('signout').onclick = signOut;
  document.querySelectorAll('nav button').forEach((b) => b.onclick = () => show(b.dataset.tab));
  el('year-pill').onclick = () => guard(toggleYearMenu);
  wireYearDialog();

  try {
    const [types, config] = await Promise.all([
      get('event_types?select=code,label,is_membership_form&order=label'),
      get('app_config?select=key,value'),
    ]);
    // Membership pays no points and routes into member demographics rather than attendance — a
    // categorically different action from the other five. Sort it last (stable sort keeps the
    // rest in the label order the API returned) so typeButtons() never lets it blend in.
    state.eventTypes = types.slice().sort((a, b) => Number(a.is_membership_form) - Number(b.is_membership_form));
    state.currentYear = config.find((c) => c.key === 'current_year_id')?.value;
    el('year-pill').textContent = state.currentYear || '';
  } catch (e) {
    // The most likely cause by far: signed in with a Google account that is not on the allowlist.
    // Kept deliberately: without it this state is an empty screen with no way to act.
    el('screen').innerHTML = `
      <div class="card">
        <h2>Signed in, but not recognised as an officer</h2>
        <p class="hint">
          <strong>${esc(session.email)}</strong> is not on the active officer list, so the database
          is refusing every read. Ask a current officer to add this address to the
          <code>officers</code> table, then sign in again.
        </p>
        <button class="ghost" id="so2">Sign out</button>
      </div>`;
    el('so2').onclick = signOut;
    return;
  }

  show('attention');
}

boot();
</script>
</body>
</html>
